XBotInterface:
  urdf_path: $(rospack find centauro_urdf)/urdf/centauro.urdf
  srdf_path: $(rospack find centauro_srdf)/srdf/centauro.srdf
  joint_map_path: $PWD/joint_map/centauro_joint_map.yaml

ModelInterface:
  model_type: RBDL
  is_model_floating_base: true


# hal
xbotcore_device_configs:
    sim: $(rospack find centauro_config)/hal/centauro_gz.yaml
    dummy: $(rospack find centauro_config)/hal/centauro_dummy.yaml
    ec_pos: $PWD/hal/centauro_ec_all.yaml
    ec_imp: $PWD/hal/centauro_ec_all.yaml
    ec_ub_imp: $PWD/hal/centauro_ec_all.yaml
    ec_idle: $PWD/hal/centauro_ec_all.yaml


# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001, core_id: 2}
    nrt_main: {sched: other, prio: 0 , period: 0.0005, core_id: 3}


# plugins
.ctrl_override: &ctrl_override
    type: map<int>
    value:
        j_wheel_1: 2
        j_wheel_2: 2
        j_wheel_3: 2
        j_wheel_4: 2
        dagana_2_claw_joint: 0

xbotcore_plugins:

    homing:
        thread: rt_main
        type: homing
        params:
          ctrl_override: *ctrl_override

    ros_io: {thread: nrt_main, type: ros_io}

    ros_control: 
        thread: nrt_main
        type: ros_control
        params:
          ctrl_override: *ctrl_override

    omnisteering:
        type: omnisteering_controller_plugin
        thread: nrt_main 
        params:
          wheel_names: 
            value: [wheel_1, wheel_2, wheel_3, wheel_4]
            type: vector<string>
          wheel_radius: 
            value: [0.124, 0.124, 0.124, 0.124]
            type: vector<double>
          max_steering_speed:
            value: 3.0
            type: double

    
    ec_ros: {thread: nrt_main, type: ec_ros}

    gcomp:
      type: centauro_gcomp_plugin
      thread: nrt_main
      params:
        problem_description:
          value: $(rospack find centauro_cartesio)/configs/centauro_force_distribution.yaml
          type: yamlfile
        contact_links: [force_contact_1, force_contact_2, force_contact_3, force_contact_4]

# global parameters
xbotcore_param:
  /xbot/hal/joint_safety/delta_check_dt: 0.01
  /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
#  /xbot/hal/joint_safety/filter_cutoff_hz: {value: 5.0, type: double}
  /xbot/hal/joint_safety/filter_safe_cutoff_hz: {value: 5.0, type: double}
  /xbot/hal/joint_safety/filter_medium_cutoff_hz: {value: 15.0, type: double}
  /xbot/hal/joint_safety/filter_fast_cutoff_hz: {value: 25.0, type: double}